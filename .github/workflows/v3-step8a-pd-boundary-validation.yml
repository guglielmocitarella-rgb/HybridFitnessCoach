name: V3 Step 8A PD Boundary Validation
on:
  push:
    branches: [ feature/exercise-db-v3 ]
    paths:
      - 'app/src/main/java/com/hybridfitnesscoach/app/domain/v3/**'
      - 'app/src/test/java/com/hybridfitnesscoach/app/domain/v3/**'
      - 'tools/validate_step8a_pd_boundary.py'
      - '.github/workflows/v3-step8a-pd-boundary-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify frozen candidate SHA
        run: echo "0a48dd6b6a3f128d28d168004976aeb989361fde6b4aba8cff6c3ac0e196911a  exercise-db-canonical/exercise-db-v3-final-candidate.json" | sha256sum -c -
      - name: Validate frozen Step 8A-S contract
        run: python3 tools/validate_step8a_pd_semantic_contract.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate frozen-candidate native coverage test
        run: python3 tools/generate_step8a_pd_coverage_test.py
      - name: Compile and run native V3 Step 8A tests
        run: >-
          gradle :app:testDebugUnitTest
          --tests 'com.hybridfitnesscoach.app.domain.v3.V3PrescriptionDependentStrengthTest'
          --tests 'com.hybridfitnesscoach.app.domain.v3.V3PdGeneratedCoverageTest'
          --tests 'com.hybridfitnesscoach.app.domain.v3.V3SelectionEngineV310CTest'
      - name: Step 8A machine validation
        run: python3 tools/validate_step8a_pd_boundary.py
      - name: Step 7B structural regression
        run: python3 tools/validate_final_canonical_candidate_step7b.py
      - name: Verify production isolation
        run: |
          git diff a3fed3667e6e542475405180ef075c1976906a96...HEAD -- app/src/main/assets app/src/main/java/com/hybridfitnesscoach/app/data app/src/main/java/com/hybridfitnesscoach/app/ui | tee /tmp/prod.diff
          test ! -s /tmp/prod.diff
      - uses: actions/upload-artifact@v4
        with:
          name: v3-step8a-pd-boundary-validation
          path: |
            exercise-db-canonical/step8a-pd-boundary-validation.json
            exercise-db-canonical/step8a-pd-semantic-contract-validation.json
            exercise-db-canonical/step7b-structural-validation.json
