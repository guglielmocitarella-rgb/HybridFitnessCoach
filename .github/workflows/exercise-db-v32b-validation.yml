name: Exercise DB V3.2B validation and audit
on:
  push:
    branches:
      - feature/exercise-db-v3
    paths:
      - '.github/workflows/exercise-db-v32b-validation.yml'
permissions:
  contents: write
jobs:
  audit-validate-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate V3.2B artifacts
        run: python tools/audit_level_capability_v32b.py
      - name: JSON syntax
        run: |
          for f in exercise-db-canonical/level-capability-audit-v3-2b.json exercise-db-canonical/level-field-patch-v3-2b.json exercise-db-canonical/level-provenance-v3-2b.json exercise-db-canonical/level-final-unresolved-v3-2b.json exercise-db-canonical/level-validation-v3-2b.json; do
            python -m json.tool "$f" >/dev/null
          done
      - name: Canonical validator
        run: python tools/validate_exercise_db_canonical.py
      - name: Regression suite
        run: python -m unittest tests/test_exercise_db_canonical.py tests/test_equipment_v31c.py tests/test_resistance_mode_v32a.py tests/test_level_capability_v32b.py -v
      - name: Integrity
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.load(open('exercise-db-canonical/exercise-db-canonical.json'))
          ids=[r['id'] for r in d]
          a=json.load(open('exercise-db-canonical/level-capability-audit-v3-2b.json'))
          assert len(d)==1087 and len(set(ids))==1087 and len(a['records'])==438
          assert pathlib.Path('exercise-db-canonical/equipment-validation-v3-1c.json').exists()
          assert pathlib.Path('exercise-db-canonical/resistance-mode-validation-v3-2a.json').exists()
          print({'canonical':len(d),'unique':len(set(ids)),'levelUnknownAudited':len(a['records'])})
          PY
      - name: Persist evidence and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p='exercise-db-canonical/level-validation-v3-2b.json'
          d=json.load(open(p))
          d.update({'status':'PASS','ciDbOnlyUsed':True,'validatedCommit':os.environ['GITHUB_SHA'],'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowName':'Exercise DB V3.2B validation and audit','tempWorkflowRemoved':True,'actualResults':{'jsonSyntax':'PASS','canonicalValidator':'PASS','regressionSuite':'PASS','integrity':'PASS'}})
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          md='exercise-db-canonical/LEVEL_CAPABILITY_AUDIT_V3_2B.md'
          with open(md,'a') as h:
              h.write('\n## Executed validation\nDB-only GitHub Actions run **'+os.environ['GITHUB_RUN_ID']+'** on commit `'+os.environ['GITHUB_SHA']+'`: PASS. JSON syntax, canonical validator, previous equipment/resistance regressions and V3.2B tests passed. Temporary workflow removed in the evidence commit.\n')
          PY
          git rm .github/workflows/exercise-db-v32b-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exercise-db-canonical/LEVEL_CAPABILITY_AUDIT_V3_2B.md exercise-db-canonical/level-capability-audit-v3-2b.json exercise-db-canonical/level-field-patch-v3-2b.json exercise-db-canonical/level-provenance-v3-2b.json exercise-db-canonical/level-final-unresolved-v3-2b.json exercise-db-canonical/level-validation-v3-2b.json exercise-db-canonical/LEVEL_CAPABILITY_SCHEMA_PROPOSAL_V3_2B.md exercise-db-canonical/SOURCE_LEVEL_NORMALIZATION_V3_2B.md tests/test_level_capability_v32b.py tools/audit_level_capability_v32b.py
          git commit -m 'db(v3.2b): audit level capability semantics and validate [skip ci]'
          git push origin HEAD:feature/exercise-db-v3
