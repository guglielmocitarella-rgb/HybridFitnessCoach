name: V3.10C-R2 Capability Evidence Checkpoint
on:
  push:
    branches: [feature/exercise-db-v3]
    paths:
      - 'tools/remediate_native_capability_v310cr2.py'
      - '.github/workflows/v310c-r2.yml'
permissions:
  contents: write
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exercise-db-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run R2 evidence checkpoint
        run: python tools/remediate_native_capability_v310cr2.py
      - name: Validate checkpoint invariants
        run: |
          python - <<'PY'
          import json, pathlib
          D=pathlib.Path('exercise-db-canonical')
          v=json.loads((D/'capability-validation-v3-10c-r2.json').read_text())
          assert v['records']==1087 and v['unique']==1087 and v['missing']==0 and v['duplicates']==0
          assert v['totalFields']==4348 and v['terminallyClassified']==4348 and v['nonTerminalUnknown']==0
          assert v['legacyLevelUsedAsCapability'] is False and v['legacyLevelFallback'] is False
          assert v['globalUnknownRelaxation'] is False and v['productionPathModified'] is False and v['runtimeDbModified'] is False
          c=json.loads((D/'exercise-db-v3-10c-r2-candidate.json').read_text())
          assert len(c)==1087 and len({x['canonicalExerciseId'] for x in c})==1087
          PY
      - name: Persist outputs and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/v310c-r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v3.10c-r2: persist evidence checkpoint [skip ci]'
          git push origin HEAD:feature/exercise-db-v3
