name: Exercise DB V3.5 Movement Gate
on:
  push:
    branches: [feature/exercise-db-v3]
    paths: ['tools/audit_movement_pattern_v35.py','tests/test_movement_pattern_v35.py','.github/workflows/exercise-db-v35-movement.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/exercise-db-v3}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/audit_movement_pattern_v35.py
      - run: python tools/validate_exercise_db_canonical.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m unittest tests/test_movement_pattern_v35.py -v
      - name: Persist V3.5 outputs
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add exercise-db-canonical/*v3-5* exercise-db-canonical/MOVEMENT_PATTERN_AUDIT_V3_5.md exercise-db-canonical/MOVEMENT_PATTERN_SCHEMA_PROPOSAL_V3_5.md
          git diff --cached --quiet && exit 0
          git commit -m "db(v3.5): persist movement pattern audit outputs"
          git push
