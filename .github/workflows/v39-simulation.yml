name: V3.9 Selection Prescription Simulation
on:
  push:
    branches:
      - feature/exercise-db-v3
    paths:
      - 'tools/simulate_engine_v39.py'
      - 'tools/validate_engine_simulation_v39.py'
      - 'tests/test_engine_simulation_v39.py'
      - '.github/workflows/v39-simulation.yml'
permissions:
  contents: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exercise-db-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp exact commit
        run: sed -i "s/__COMMIT__/$GITHUB_SHA/g" tools/simulate_engine_v39.py
      - name: Execute simulation
        shell: bash
        run: |
          set -o pipefail
          python tools/simulate_engine_v39.py 2>&1 | tee v39-simulation.log
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v39-diagnostic
          path: v39-simulation.log
      - name: Regression V3.1-V3.9
        run: |
          python -m unittest tests/test_engine_simulation_v39.py -v
          python tools/validate_engine_schema_candidate_v37.py
          python tools/validate_engine_ready_candidate_v38.py
      - name: Final validator
        run: python tools/validate_engine_simulation_v39.py
      - name: Persist validated outputs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercise-db-canonical/*v3-9.json exercise-db-canonical/SELECTION_PRESCRIPTION_SIMULATION_V3_9.md
          git rm .github/workflows/v39-simulation.yml
          git commit -m "audit(db): persist corrected V3.9 simulation [skip ci]"
          git push origin HEAD:feature/exercise-db-v3
