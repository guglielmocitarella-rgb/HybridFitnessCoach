name: V3.9R Capability Remediation
on:
  push:
    branches: [feature/exercise-db-v3]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: |
          python tools/simulate_engine_v39r.py
          python -m pytest -q tests/test_engine_simulation_v39.py tests/test_engine_simulation_v39r.py
          python -m json.tool exercise-db-canonical/capability-selection-remediation-v3-9r.json >/dev/null
          git diff --exit-code -- app/src/main/assets/exercise-db-v2
      - name: Persist reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercise-db-canonical/simulation-summary-v3-9.json exercise-db-canonical/simulation-failures-v3-9.json exercise-db-canonical/simulation-blocker-queue-v3-9.json exercise-db-canonical/capability-selection-remediation-v3-9r.json
          if ! git diff --cached --quiet; then
            git commit -m "V3.9R: persist capability remediation reports"
            git push
          fi
