name: Exercise DB V3.6 Engine Readiness

on:
  push:
    branches: [feature/exercise-db-v3]
    paths:
      - 'exercise-db-canonical/**'
      - 'tools/audit_engine_readiness_v36.py'
      - 'tools/validate_exercise_db_canonical.py'
      - 'tests/test_exercise_db_canonical.py'
      - 'tests/test_skill_bridge_v32c.py'
      - 'tests/test_engine_readiness_v36.py'
      - '.github/workflows/exercise-db-v36.yml'

concurrency:
  group: exercise-db-v36-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  v36:
    # Persisted V3.6 artifacts are generated by this workflow itself.
    # Do not recursively re-run CI for github-actions[bot] persistence commits.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: |
          python tools/audit_engine_readiness_v36.py
          python -m json.tool exercise-db-canonical/engine-readiness-summary-v3-6.json >/dev/null
          python tools/validate_exercise_db_canonical.py
          python -m pytest -q tests/test_exercise_db_canonical.py tests/test_skill_bridge_v32c.py tests/test_engine_readiness_v36.py
          git diff --exit-code -- app/src/main/assets/exercise-db-v2
      - name: Persist V3.6 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercise-db-canonical/ENGINE_READINESS_CONSOLIDATION_V3_6.md exercise-db-canonical/*v3-6.json
          if ! git diff --cached --quiet; then
            git commit -m "V3.6: persist engine readiness consolidation [skip ci]"
            git push
          fi
