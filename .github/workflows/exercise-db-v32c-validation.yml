name: Exercise DB V3.2C validation and audit
on:
  push:
    branches: [feature/exercise-db-v3]
    paths: ['tools/audit_skill_bridge_v32c.py','tests/test_skill_bridge_v32c.py','.github/workflows/exercise-db-v32c-validation.yml']
permissions: {contents: write}
jobs:
  audit-validate-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate V3.2C artifacts
        run: python tools/audit_skill_bridge_v32c.py
      - name: JSON syntax
        run: for f in exercise-db-canonical/skill-*-v3-2c.json; do python -m json.tool "$f" >/dev/null; done
      - name: Canonical validator
        run: python tools/validate_exercise_db_canonical.py
      - name: Regression suite
        run: python -m unittest tests/test_exercise_db_canonical.py tests/test_equipment_v31c.py tests/test_resistance_mode_v32a.py tests/test_level_capability_v32b.py tests/test_skill_bridge_v32c.py -v
      - name: Referential and integrity gate
        run: |
          python - <<'PY'
          import json
          a=json.load(open('exercise-db-canonical/skill-bridge-audit-v3-2c.json'))
          assert a['integrity']=={'canonical':1087,'unique':1087,'missingIds':0,'duplicates':0}
          assert a['skillCatalog']['verifiedSkillCount']==15
          assert a['missingUnstableWorkset']['verifiedCount']==143
          assert not a['invalidReferences']
          print(a['existingLinks'])
          PY
      - name: Persist evidence and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          p='exercise-db-canonical/skill-validation-v3-2c.json'
          d=json.load(open(p)); d.update({'status':'PASS','ciDbOnlyUsed':True,'validatedCommit':os.environ['GITHUB_SHA'],'workflowRunId':int(os.environ['GITHUB_RUN_ID']),'workflowName':'Exercise DB V3.2C validation and audit','tempWorkflowRemoved':True,'actualResults':{'jsonSyntax':'PASS','canonicalValidator':'PASS','regressionSuite':'PASS','referentialIntegrity':'PASS'}})
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          with open('exercise-db-canonical/SKILL_BRIDGE_AUDIT_V3_2C.md','a') as h: h.write('\n## Executed validation\nDB-only GitHub Actions run **'+os.environ['GITHUB_RUN_ID']+'** on commit '+os.environ['GITHUB_SHA']+': PASS. JSON syntax, canonical validator, prior equipment/resistance/level regressions, Skill Bridge tests, integrity and referential integrity passed. Temporary workflow removed in the evidence commit.\n\n## Final gate\n**CLOSED_WITH_DOCUMENTED_UNRESOLVED** — 143/143 unstable records audited; no invented skill membership; typed-relation schema gap documented.\n')
          PY
          git rm .github/workflows/exercise-db-v32c-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exercise-db-canonical/SKILL_BRIDGE_AUDIT_V3_2C.md exercise-db-canonical/skill-bridge-audit-v3-2c.json exercise-db-canonical/skill-relations-v3-2c.json exercise-db-canonical/skill-provenance-v3-2c.json exercise-db-canonical/skill-final-unresolved-v3-2c.json exercise-db-canonical/skill-validation-v3-2c.json exercise-db-canonical/SKILL_RELATION_SCHEMA_PROPOSAL_V3_2C.md tools/audit_skill_bridge_v32c.py tests/test_skill_bridge_v32c.py
          git commit -m 'db(v3.2c): audit skill bridge semantics and validate [skip ci]'
          git push origin HEAD:feature/exercise-db-v3

# trigger after workflow registration
