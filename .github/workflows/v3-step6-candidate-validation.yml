name: V3 Step 6 Candidate Validation

on:
  push:
    branches:
      - feature/exercise-db-v3
    paths:
      - '.github/workflows/v3-step6-candidate-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v3-step6-candidate-validation.yml'
      - 'tools/build_final_canonical_candidate_step6.py'
      - 'tools/test_build_final_canonical_candidate_step6.py'
      - 'tools/validate_step5_semantic_disposition.py'

permissions:
  contents: read

jobs:
  validate-step6-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Step 5 semantic disposition
        run: python tools/validate_step5_semantic_disposition.py

      - name: Run Step 6 builder tests
        run: python tools/test_build_final_canonical_candidate_step6.py

      - name: Build candidate twice independently
        run: |
          mkdir -p /tmp/step6-run1 /tmp/step6-run2
          python tools/build_final_canonical_candidate_step6.py --output /tmp/step6-run1/final-candidate.json --report /tmp/step6-run1/report.json
          python tools/build_final_canonical_candidate_step6.py --output /tmp/step6-run2/final-candidate.json --report /tmp/step6-run2/report.json

      - name: Verify determinism and authoritative invariants
        run: |
          sha256sum /tmp/step6-run1/final-candidate.json /tmp/step6-run2/final-candidate.json
          cmp /tmp/step6-run1/final-candidate.json /tmp/step6-run2/final-candidate.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path(".")
          c = root / "exercise-db-canonical"
          out1 = Path("/tmp/step6-run1/final-candidate.json")
          out2 = Path("/tmp/step6-run2/final-candidate.json")
          rep1 = json.loads(Path("/tmp/step6-run1/report.json").read_text())
          rep2 = json.loads(Path("/tmp/step6-run2/report.json").read_text())
          cand = json.loads(out1.read_text())
          records = cand if isinstance(cand, list) else cand.get("exercises", cand.get("records", []))
          ids = [r["canonicalExerciseId"] for r in records]

          required = {
              "sourceCandidateRecords": 1087,
              "outputRecords": 1087,
              "canonicalIdsUnique": 1087,
              "duplicateIds": 0,
              "r5ResolvedApplied": 3787,
              "prescriptionDependentSource": 441,
              "prescriptionDependentPreserved": 441,
              "prescriptionDependentDropped": 0,
              "accidentallyScalarized": 0,
              "terminalAccounted": 48,
              "orphanExcluded": 148,
              "redundantNoOp": 2,
              "unresolvedPrecedence": 0,
              "trueMissing": 0,
              "materializationParity": "3787/3787",
              "buildConflictsErrors": [],
          }
          for report in (rep1, rep2):
              for k, expected in required.items():
                  actual = report.get(k)
                  assert actual == expected, (k, actual, expected)

          assert len(records) == 1087
          assert len(ids) == len(set(ids)) == 1087

          setv = json.loads((c / "native-capability-r5-set-validation.json").read_text())
          assert setv["counts"] == {
              "universe": 3835,
              "resolvedInUniverse": 3787,
              "terminalInUniverse": 48,
              "trueMissing": 0,
              "authoritativeOutOfUniverse": 214,
          }
          mat = json.loads((c / "native-capability-r5-materialization-validation.json").read_text())
          assert mat["patch"]["inUniverseParity"] == "3787/3787"
          disp = json.loads((c / "semantic-disposition-step5.json").read_text())
          assert disp["counts"]["precedenceRequiredAfterDisposition"] == 0
          assert disp["counts"]["globalPrescriptionDependent"] == 441

          by_id = {r["canonicalExerciseId"]: r for r in records}
          terminal = json.loads((c / "native-capability-r5-terminal-membership.json").read_text())["entries"]
          assert len(terminal) == 48
          terminal_accidentally_resolved = 0
          for e in terminal:
              eid, field = e["semanticKey"].split("::", 1)
              if by_id[eid]["capability"].get(field) != "EVIDENCE_UNRESOLVED":
                  terminal_accidentally_resolved += 1
          assert terminal_accidentally_resolved == 0

          h1 = hashlib.sha256(out1.read_bytes()).hexdigest()
          h2 = hashlib.sha256(out2.read_bytes()).hexdigest()
          assert h1 == h2
          Path("/tmp/step6-sha256.txt").write_text(
              f"{h1}  run1/final-candidate.json\n{h2}  run2/final-candidate.json\n"
          )
          print(json.dumps({
              "result": "PASS",
              "records": len(records),
              "uniqueIds": len(set(ids)),
              "duplicateIds": len(ids) - len(set(ids)),
              "sha256Run1": h1,
              "sha256Run2": h2,
              "identical": True,
              "terminalSource": 48,
              "terminalAccounted": rep1["terminalAccounted"],
              "terminalAccidentallyResolved": terminal_accidentally_resolved,
              **required,
          }, sort_keys=True))
          PY

      - name: Stage validation artifact
        if: success()
        run: |
          mkdir -p /tmp/v3-step6-candidate-validation/run1 /tmp/v3-step6-candidate-validation/run2
          cp /tmp/step6-run1/final-candidate.json /tmp/v3-step6-candidate-validation/run1/
          cp /tmp/step6-run1/report.json /tmp/v3-step6-candidate-validation/run1/
          cp /tmp/step6-run2/final-candidate.json /tmp/v3-step6-candidate-validation/run2/
          cp /tmp/step6-run2/report.json /tmp/v3-step6-candidate-validation/run2/
          cp /tmp/step6-sha256.txt /tmp/v3-step6-candidate-validation/SHA256SUMS.txt

      - name: Upload validation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v3-step6-candidate-validation
          path: /tmp/v3-step6-candidate-validation/
          if-no-files-found: error
          retention-days: 14


  promote-exact-validated-step6-artifact:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '11505158751'
      SOURCE_RUN_ID: '37672449254'
      SOURCE_EXECUTION_HEAD: 'c7a2a25fc9088d47a44e894840ddb4912c94338a'
      EXPECTED_ARTIFACT_DIGEST: 'sha256:4dd503203c3cbffe2002809008f03227bfcaf0219e549235099897fd69997d0f'
      EXPECTED_SHA: '0a48dd6b6a3f128d28d168004976aeb989361fde6b4aba8cff6c3ac0e196911a'
      EXPECTED_SIZE: '19054419'
      FINAL_PATH: 'exercise-db-canonical/exercise-db-v3-final-candidate.json'
      REPORT_PATH: 'exercise-db-canonical/final-canonical-candidate-step6-validation.json'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/exercise-db-v3
          fetch-depth: 0

      - name: Download and verify exact prior artifact
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/step6.zip
          rm -rf /tmp/step6-artifact && mkdir -p /tmp/step6-artifact
          unzip -q /tmp/step6.zip -d /tmp/step6-artifact
          RUN1=/tmp/step6-artifact/run1/final-candidate.json
          RUN2=/tmp/step6-artifact/run2/final-candidate.json
          test -f "$RUN1" && test -f "$RUN2"
          SHA1="$(sha256sum "$RUN1" | awk '{print $1}')"
          SHA2="$(sha256sum "$RUN2" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$RUN1")"
          test "$SHA1" = "$EXPECTED_SHA"
          test "$SHA2" = "$EXPECTED_SHA"
          test "$SIZE" = "$EXPECTED_SIZE"
          cmp "$RUN1" "$RUN2"
          echo "pre-copy sha256=$SHA1 size=$SIZE"

      - name: Promote bytes and freeze report
        run: |
          set -euo pipefail
          RUN1=/tmp/step6-artifact/run1/final-candidate.json
          mkdir -p "$(dirname "$FINAL_PATH")"
          cp "$RUN1" "$FINAL_PATH"
          POST="$(sha256sum "$FINAL_PATH" | awk '{print $1}')"
          test "$POST" = "$EXPECTED_SHA"
          test "$(stat -c '%s' "$FINAL_PATH")" = "$EXPECTED_SIZE"
          cmp "$RUN1" "$FINAL_PATH"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ["FINAL_PATH"])
          b = p.read_bytes()
          sha = hashlib.sha256(b).hexdigest()
          assert sha == os.environ["EXPECTED_SHA"]
          report = {
            "step": "STEP_6",
            "status": "FROZEN_VALIDATED_FINAL_CANONICAL_CANDIDATE",
            "sourceExecutionHead": os.environ["SOURCE_EXECUTION_HEAD"],
            "actionsRunId": int(os.environ["SOURCE_RUN_ID"]),
            "artifactId": int(os.environ["ARTIFACT_ID"]),
            "artifactDigest": os.environ["EXPECTED_ARTIFACT_DIGEST"],
            "candidateSha256": sha,
            "candidateSizeBytes": len(b),
            "deterministic": True,
            "records": 1087,
            "uniqueCanonicalIds": 1087,
            "duplicateCanonicalIds": 0,
            "U_R5": 3835,
            "resolved": 3787,
            "terminal": 48,
            "TRUE_MISSING": 0,
            "materialization": "3787/3787",
            "precedenceRequired": 0,
            "prescriptionDependentSource": 441,
            "prescriptionDependentPreserved": 441,
            "prescriptionDependentDropped": 0,
            "prescriptionDependentAccidentallyScalarized": 0,
            "terminalAccounted": 48,
            "terminalAccidentallyResolved": 0,
            "orphanExcluded": 148,
            "redundantNoOp": 2,
            "unresolvedBuildConflicts": 0,
            "productionIntegrated": False,
            "runtimeSwitchPerformed": False,
            "preCopySha256": sha,
            "postCopySha256": sha,
            "repositoryCandidateSha256": sha,
            "allCandidateHashesIdentical": True
          }
          Path(os.environ["REPORT_PATH"]).write_text(
            json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Commit only final candidate and freeze report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FINAL_PATH" "$REPORT_PATH"
          mapfile -t STAGED < <(git diff --cached --name-only)
          test "${#STAGED[@]}" -eq 2
          printf '%s\n' "${STAGED[@]}" | grep -Fx "$FINAL_PATH"
          printf '%s\n' "${STAGED[@]}" | grep -Fx "$REPORT_PATH"
          test "$(sha256sum "$FINAL_PATH" | awk '{print $1}')" = "$EXPECTED_SHA"
          git commit -m "v3: freeze final canonical candidate"
          git push origin HEAD:feature/exercise-db-v3
          echo "PROMOTION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Emit final evidence
        run: |
          set -euo pipefail
          echo "promotion_commit=$PROMOTION_COMMIT"
          echo "candidate_sha256=$(sha256sum "$FINAL_PATH" | awk '{print $1}')"
          echo "candidate_size=$(stat -c '%s' "$FINAL_PATH")"
          git show --name-only --format='' "$PROMOTION_COMMIT"
