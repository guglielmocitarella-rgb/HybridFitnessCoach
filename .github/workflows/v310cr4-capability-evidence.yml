name: V3.10C R4 capability evidence at scale
on:
  push:
    branches: [feature/exercise-db-v3]
    paths: [tools/remediate_capability_v310cr4.py]
permissions: {contents: write}
jobs:
  r4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/exercise-db-v3, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/remediate_capability_v310cr4.py
      - run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path("exercise-db-canonical");v=json.loads((d/"capability-validation-v3-10c-r4.json").read_text())
          assert (v["records"],v["unique"],v["missing"],v["duplicates"])==(1087,1087,0,0)
          assert v["initialResidual"]==3835
          assert not any(v[k] for k in ("legacyMappingFallback","nameOnlyInference","globalUnknownRelaxation","productionPathModified","runtimeDbModified"))
          print(v)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercise-db-canonical/
          git diff --cached --quiet && exit 0
          git commit -m "v3.10c-r4: persist at-scale evidence checkpoint [skip ci]"
          git push origin HEAD:feature/exercise-db-v3
