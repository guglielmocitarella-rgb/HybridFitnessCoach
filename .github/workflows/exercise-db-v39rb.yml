name: V3.9R-B Residual Selection Remediation
on:
  push:
    branches: [feature/exercise-db-v3]
    paths:
      - 'tools/audit_residual_selection_v39rb.py'
      - 'tests/test_residual_selection_v39rb.py'
      - '.github/workflows/exercise-db-v39rb.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute V3.9R-B
        run: |
          python tools/audit_residual_selection_v39rb.py
          python -m unittest tests/test_residual_selection_v39rb.py -v
          git diff --exit-code -- app/src/main/assets/exercise-db-v2 app/src/main/java/com/hybridfitnesscoach/app
      - name: Persist validated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercise-db-canonical
          if ! git diff --cached --quiet; then
            git commit -m "V3.9R-B: close residual selection coverage"
            git push
          fi
