name: R5 normal batch once
on:
  push:
    branches: [feature/exercise-db-v3]
    paths:
      - '.github/workflows/r5-normal-batch-once.yml'
permissions:
  contents: write
concurrency:
  group: r5-normal-batch-once
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/exercise-db-v3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated R5 batch
        shell: bash
        run: bash tools/ops/r5_normal_batch_once.sh
