name: V3 Step 8 Massive Selection Harness (B0 scaffold)
on:
  push:
    branches: [feature/exercise-db-v3]
    paths:
      - 'tools/step8/**'
      - 'app/src/test/java/com/hybridfitnesscoach/app/domain/v3/V3MassiveSelectionHarnessTest.kt'
      - '.github/workflows/v3-step8-massive-selection-validation.yml'
  workflow_dispatch:
jobs:
  harness-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify frozen candidate
        run: echo "0a48dd6b6a3f128d28d168004976aeb989361fde6b4aba8cff6c3ac0e196911a  exercise-db-canonical/exercise-db-v3-final-candidate.json" | sha256sum -c -
      - name: Step 7B structural regression
        run: python3 tools/validate_final_canonical_candidate_step7b.py
      - name: Step 8A-S semantic contract regression
        run: python3 tools/validate_step8a_pd_semantic_contract.py
      - name: Step 8A boundary regression
        run: python3 tools/validate_step8a_pd_boundary.py
      - name: Generate deterministic planning manifest
        run: python3 tools/step8/generate_manifest.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run native V3 selector invariant tests
        run: gradle :app:testDebugUnitTest --tests 'com.hybridfitnesscoach.app.domain.v3.V3MassiveSelectionHarnessTest'
      - name: Upload planning artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-step8-b0-planning
          path: build/step8/
