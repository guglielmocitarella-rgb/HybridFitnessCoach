name: V3 Step 8 Massive Selection Validation

on:
  push:
    branches: [feature/exercise-db-v3]
    paths:
      - 'tools/step8/**'
      - 'app/src/test/java/com/hybridfitnesscoach/app/domain/v3/V3MassiveSelectionHarnessTest.kt'
      - '.github/workflows/v3-step8-massive-selection-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  massive-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify frozen candidate
        run: echo "0a48dd6b6a3f128d28d168004976aeb989361fde6b4aba8cff6c3ac0e196911a  exercise-db-canonical/exercise-db-v3-final-candidate.json" | sha256sum -c -
      - name: Step 7B structural regression
        run: python3 tools/validate_final_canonical_candidate_step7b.py
      - name: Step 8A-S semantic contract regression
        run: python3 tools/validate_step8a_pd_semantic_contract.py
      - name: Step 8A native boundary regression
        run: python3 tools/validate_step8a_pd_boundary.py
      - name: Generate executable deterministic matrix
        run: python3 tools/step8/generate_manifest.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Execute native V3 massive selection harness
        run: gradle :app:testDebugUnitTest --tests 'com.hybridfitnesscoach.app.domain.v3.V3MassiveSelectionHarnessTest'
      - name: Print native harness failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in case.findall("failure"):
                      print("FAILED TEST: " + case.get("classname", "") + "." + case.get("name", ""))
                      print("MESSAGE: " + str(failure.get("message", "")))
                      print(failure.text or "")
          PY
      - name: Upload matrix and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-step8-massive-selection
          if-no-files-found: error
          path: |
            build/step8/scenario-manifest.json
            build/step8/inventory.json
            build/step8/execution-report.json
            app/build/test-results/testDebugUnitTest/
