name: R5 C1 candidate diagnostic dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-c1-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: diagnostic-tools
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable R4 and R5 baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f2698fc2ec51472a34d12502a3b74d89322ec186
          path: diagnostic-data
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run focused diagnostic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 -m unittest discover
          -s diagnostic-tools/tests
          -p test_r5_candidate_dry_run.py -v

      - name: Protect data checkout
        run: chmod -R a-w diagnostic-data

      - name: Run diagnostic only
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 diagnostic-tools/tools/r5_candidate_dry_run.py
          --root "$GITHUB_WORKSPACE/diagnostic-data"
          --report-dir "$RUNNER_TEMP/r5-c1-report"

      - name: Upload diagnostic reports including controlled failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r5-c1-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r5-c1-report/r5-c1-dry-run-report.json
            ${{ runner.temp }}/r5-c1-report/r5-c1-dry-run-report.md
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
