name: Exercise DB V3.2C-R validation
on:
  push:
    branches: [feature/exercise-db-v3]
permissions:
  contents: write
jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/exercise-db-v3, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate typed skill remediation
        run: python tools/audit_skill_bridge_v32c.py
      - name: JSON syntax
        run: python - <<'PY'
          import json,pathlib
          for p in pathlib.Path('exercise-db-canonical').glob('*v3-2c.json'): json.load(open(p))
          print('JSON PASS')
          PY
      - name: Canonical validator
        run: python tools/validate_exercise_db_canonical.py
      - name: Regression suite
        run: python -m unittest tests.test_exercise_db_canonical tests.test_equipment_v31c tests.test_resistance_mode_v32a tests.test_level_capability_v32b tests.test_skill_bridge_v32c
      - name: Finalize validation evidence
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('exercise-db-canonical/skill-validation-v3-2c.json'); x=json.load(open(p))
          x.update({"validatedCommit":os.environ["GITHUB_SHA"],"status":"PASS","auditCommand":"python tools/audit_skill_bridge_v32c.py","auditResult":"PASS","validatorCommand":"python tools/validate_exercise_db_canonical.py","validatorResult":"PASS","testCommand":"python -m unittest tests.test_exercise_db_canonical tests.test_equipment_v31c tests.test_resistance_mode_v32a tests.test_level_capability_v32b tests.test_skill_bridge_v32c","testResult":"PASS","validationEnvironment":"GitHub Actions ubuntu-latest Python 3.12","ciRun":os.environ["GITHUB_RUN_ID"]})
          p.write_text(json.dumps(x,indent=2)+"\n")
          PY
      - name: Persist final artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add exercise-db-canonical/skill-* exercise-db-canonical/SKILL_*
          git commit -m "db(v3.2c): persist typed skill remediation and validation [skip ci]"
          git push origin HEAD:feature/exercise-db-v3
