name: Android APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Restore signing keystore
        if: ${{ github.event_name != 'pull_request' }}
        env:
          HFC_KEYSTORE_BASE64: ${{ secrets.HFC_KEYSTORE_BASE64 }}
        run: |
          test -n "$HFC_KEYSTORE_BASE64"
          echo "$HFC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hybridfitnesscoach-release.jks"

      - name: Build signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          HFC_KEYSTORE_PATH: ${{ runner.temp }}/hybridfitnesscoach-release.jks
          HFC_KEYSTORE_PASSWORD: ${{ secrets.HFC_KEYSTORE_PASSWORD }}
          HFC_KEY_ALIAS: ${{ secrets.HFC_KEY_ALIAS }}
          HFC_KEY_PASSWORD: ${{ secrets.HFC_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: HybridFitnessCoach-v0.9.1-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build PR debug APK
        if: ${{ github.event_name == 'pull_request' }}
        run: gradle :app:assembleDebug
